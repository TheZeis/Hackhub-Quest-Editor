<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Quest editor illustration</title>
    <link rel="stylesheet" href="./assets/renderer.css" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #0c0e13;
        color: #e8eaf1;
        font: 13px/1.5 system-ui, sans-serif;
      }
      .figure-fallback {
        box-sizing: border-box;
        display: grid;
        width: 100%;
        height: 100%;
        place-content: center;
        padding: 24px;
        background: #0c0e13;
        color: #e8eaf1;
      }
      .figure-fallback section {
        max-width: 340px;
        border: 1px solid #343a49;
        border-radius: 8px;
        background: #12141b;
        padding: 18px;
      }
      .figure-fallback p {
        margin: 8px 0 0;
        color: #aab1c2;
        font-size: 12px;
        line-height: 1.5;
      }
    </style>
    <script>
      (() => {
        const isolatedStorage = Object.freeze({
          get length() { return 0; },
          key() { return null; },
          getItem() { return null; },
          setItem() {},
          removeItem() {},
          clear() {},
        });
        for (const name of ["localStorage", "sessionStorage"]) {
          try {
            Object.defineProperty(window, name, {
              configurable: true,
              value: isolatedStorage,
            });
          } catch {
            // The sandbox may already make storage unavailable. The editor's
            // preference readers treat that exactly like a fresh install.
          }
        }
      })();
    </script>
    <script defer src="./assets/renderer.js"></script>
  </head>
  <body inert>
    <div id="root">
      <div class="figure-fallback">
        <section>
          <strong>This editor illustration could not load.</strong>
          <p>Use the explanation and caption on the surrounding manual page.</p>
        </section>
      </div>
    </div>
  </body>
</html>
